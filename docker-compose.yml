services:
  postgres:
    image: postgres:16-alpine
    container_name: kounouz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kounouz
      POSTGRES_PASSWORD: kounouz
      POSTGRES_DB: kounouz_alafiya
    ports:
      - '5433:5432'
    volumes:
      - kounouz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kounouz -d kounouz_alafiya']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kounouz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kounouz:kounouz@postgres:5432/kounouz_alafiya?schema=public
      PORT: 3000
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      PUBLIC_APP_URL: http://localhost:5173
    ports:
      - '3000:3000'
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kounouz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - '5173:5173'

volumes:
  kounouz_postgres_data:
