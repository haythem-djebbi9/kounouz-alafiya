server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # nginx refuse par défaut tout envoi de plus de 1 Mo (erreur 413). L'API
  # accepte jusqu'à 10 Mo par fichier (documents producteur, bulletins de
  # laboratoire) : marge pour l'enveloppe multipart.
  client_max_body_size 15m;

  # En-têtes de sécurité (repris dans /assets/, qui définit ses propres en-têtes).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Géolocalisation et caméra : utilisées par le portail Agent terrain.
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

  # Compression des assets texte.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;
  gzip_min_length 1024;

  # Les assets versionnés par Vite (hash dans le nom) sont immuables.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Images du site : non versionnées, mais rarement modifiées.
  location /images/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # L'API et les fichiers téléversés sont servis par le backend. Le proxy
  # évite tout CORS en production : le navigateur ne voit qu'une origine.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Conserve l'IP du visiteur : elle alimente le journal des scans et
    # l'analyse anti-contrefaçon côté backend.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Plan du site : généré par l'API à partir des produits en vente et des
  # articles publiés. Auparavant, /sitemap.xml renvoyait la page HTML.
  location = /sitemap.xml {
    proxy_pass http://backend:3000/api/v1/seo/sitemap.xml;
    proxy_set_header Host $host;
  }

  # robots.txt est un vrai fichier (public/robots.txt) : jamais remplacé par
  # la page de l'application.
  location = /robots.txt {
    try_files $uri =404;
  }

  # Accueil.
  location = / {
    try_files /index.html =404;
  }

  # Adresses rendues par React Router : la vitrine (blog, fiches produit,
  # pages légales), la vérification d'un pot et les portails. Sans ce
  # renvoi vers index.html, un scan de QR renverrait un 404 nginx.
  location ~ ^/(blog|produit|verify|connexion|inscription|guide|confidentialite|conditions|retours|producteur|agent|verificateur|admin)(/|$) {
    try_files $uri /index.html;
  }

  # Toute autre adresse : le fichier s'il existe (favicon…), sinon la page de
  # l'application avec un vrai statut 404 — React y affiche « page
  # introuvable ». Avant, une adresse inventée renvoyait 200 et l'accueil :
  # autant de pages fantômes indexables. error_page sans « = » conserve le 404.
  location / {
    try_files $uri =404;
    error_page 404 /index.html;
  }
}
