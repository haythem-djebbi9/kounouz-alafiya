server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # nginx refuse par défaut tout envoi de plus de 1 Mo (erreur 413). L'API
  # accepte jusqu'à 10 Mo par fichier (documents producteur, bulletins de
  # laboratoire) : marge pour l'enveloppe multipart.
  client_max_body_size 15m;

  # En-têtes de sécurité (repris dans /assets/, qui définit ses propres en-têtes).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Géolocalisation et caméra : utilisées par le portail Agent terrain.
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

  # Compression des assets texte.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Les assets versionnés par Vite (hash dans le nom) sont immuables.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # L'API et les fichiers téléversés sont servis par le backend. Le proxy
  # évite tout CORS en production : le navigateur ne voit qu'une origine.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Conserve l'IP du visiteur : elle alimente le journal des scans et
    # l'analyse anti-contrefaçon côté backend.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA : toute autre route est rendue par React Router (/verify/:id, les
  # portails...). Sans ce fallback, un scan de QR renverrait un 404 nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
