<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C261B" />
    <link rel="icon" type="image/png" href="/images/favicon-64.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <!-- Image de l'accueil (au-dessus de la ligne de flottaison) : chargée dès l'analyse du HTML. -->
    <link rel="preload" as="image" href="/images/banner.webp" type="image/webp" />
    <title>كنوز العافية | عسل طبيعي فاخر - جودة يمكن التحقق منها</title>
    <meta name="description" content="كنوز العافية - من خيرات الطبيعة، نختار لكم منتجات تجمع بين النقاء، العناية، والشفافية. عسل طبيعي نقي 100% قابل للتحقق." />
    <!-- Aperçus WhatsApp / Facebook / X : leurs robots n'exécutent pas le
         JavaScript, ils ne lisent que ces balises. L'image doit avoir une
         adresse absolue. Chaque page met ensuite à jour titre et description
         pour les moteurs qui, eux, exécutent le JavaScript (lib/page-meta.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="كنوز العافية · Kounouz Alafiya" />
    <meta property="og:url" content="https://kounouzalafia.io/" />
    <meta property="og:title" content="كنوز العافية | عسل نقي. عافية حقيقية." />
    <meta property="og:description" content="عسل نقي، عافية حقيقية، جودة يمكن التحقق منها." />
    <meta property="og:image" content="https://kounouzalafia.io/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pot de miel Kounouz Alafiya" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kounouzalafia.io/images/og-image.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kounouz Alafiya",
        "alternateName": "كنوز العافية",
        "url": "https://kounouzalafia.io/",
        "logo": "https://kounouzalafia.io/images/apple-touch-icon.png",
        "email": "contact@kounouzalafia.io",
        "address": { "@type": "PostalAddress", "addressLocality": "Tunis", "addressCountry": "TN" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF6EE] text-[#0E3027] antialiased selection:bg-[#D49B37] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
